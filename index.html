    // ============ Types & Data ============

        { title: "3. 品牌调性", items: [], placeholder: "✍️ 待补充\n这里将定义品牌的性格与视觉偏好。\n💡 例如：极简克制、或者美式复古风" },
        { title: "4. 品牌红线", items: [], placeholder: "✍️ 待补充\n这里将记录品牌绝对不能触碰的雷区。\n💡 例如：绝不使用「平替」、「全网最低」" },

      tagReplies: {
        "👥 目标人群": "目标人群这个维度，您可以补充这些信息：\n\n• 核心受众是谁？（年龄、职业、消费能力）\n• 他们的核心痛点是什么？\n• 典型使用场景？（例如：下班微醺、聚会狂欢）\n\n您可以直接输入，或粘贴已有的用户调研内容～",

      rightContent: [
        { title: "2. 目标人群", items: ["一二线都市白领，追求下班后的微醺"] },
        { title: "3. 品牌调性", items: ["赛博朋克风，前卫大胆"] },

        { title: "🔓 6. 营销策略与关键节点 ✨", items: ["🎯 策略：打造「赛博修仙」的周末微醺场景", "📍 Q1 春季：推出「桃花酿」赛博限定版...", "📍 Q2 盛夏：举办地下电音精酿派对..."] }
      ]

    const VARIANT_4_5 = {

        { id: "1", role: "user", content: "我们这款酒的客单价大概在 800 元/瓶。" },

        { title: "6. 营销策略与关键节点", locked: true, note: "解决冲突后生成" }
      ]
    };

    const VARIANTS = { "4.1": VARIANT_4_1, "4.3": VARIANT_4_3, "4.5": VARIANT_4_5 };
    const TYPE_ICONS = { file: "📄", image: "🖼️", text: "📝", link: "🔗" };

    // ============ UI Components ============
    function Button({ variant = "primary", size = "md", className = "", children, ...props }) {
      const base = "inline-flex items-center justify-center font-medium transition-all duration-150 rounded-md disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = { primary: "bg-black text-white hover:shadow-md", secondary: "bg-white text-black border-[1.5px] border-black hover:bg-black hover:text-white", ghost: "text-gray-500 hover:bg-gray-100 hover:text-black" };
      const sizes = { sm: "px-4 py-2 text-xs", md: "px-6 py-3 text-sm", lg: "px-8 py-4 text-base" };
      return <button className={`${base} ${variants[variant] || variants.primary} ${sizes[size]} ${className}`} {...props}>{children}</button>;
    }

    function MultiModalInputBar({ placeholder = "请输入...", submitLabel = "发送", onSubmit, onFileUpload, primaryLabel, onPrimaryClick, value: controlledValue, onChange: controlledOnChange, disabled = false, compact = false }) {
      const [internalValue, setInternalValue] = useState("");
      const fileInputRef = useRef(null);
      const isControlled = controlledValue !== undefined && controlledOnChange !== undefined;
      const inputValue = isControlled ? controlledValue : internalValue;
      const setInputValue = isControlled ? controlledOnChange : setInternalValue;

      const handleSubmit = () => {
        const trimmed = inputValue.trim();
        if (trimmed && !disabled) { onSubmit(trimmed); setInputValue(""); }
      };
      const handleKeyDown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSubmit(); } };
      const handleFileChange = (e) => { const f = e.target.files?.[0]; if (f && onFileUpload) onFileUpload(f); e.target.value = ""; };

      return (
        <div className={`flex items-center gap-2 rounded-lg border-2 border-gray-300 bg-white p-2 transition-colors focus-within:border-black ${disabled ? "opacity-60 pointer-events-none" : ""}`}>
          <label className="flex shrink-0 cursor-pointer rounded p-1.5 text-gray-400 hover:bg-gray-100 hover:text-black">
            <input ref={fileInputRef} type="file" accept=".pdf,.doc,.docx,.txt" className="hidden" onChange={handleFileChange} />
            <span>📎</span>
          </label>
          <label className="flex shrink-0 cursor-pointer rounded p-1.5 text-gray-400 hover:bg-gray-100 hover:text-black">
            <input type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
            <span>🖼️</span>
          </label>
          <button type="button" className="shrink-0 rounded p-1.5 text-gray-400 hover:text-black" title="语音输入">🎤</button>
          <input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} placeholder={placeholder} disabled={disabled}
            className="min-w-0 flex-1 bg-transparent px-2 py-2.5 text-sm text-black outline-none placeholder:text-gray-400" />
          {primaryLabel && onPrimaryClick ? (
            <Button size={compact ? "sm" : "md"} onClick={() => onPrimaryClick(inputValue.trim() || undefined)}>{primaryLabel}</Button>
          ) : (
            <Button size={compact ? "sm" : "md"} onClick={handleSubmit} disabled={!inputValue.trim() || disabled}>{submitLabel}</Button>
          )}
        </div>
      );
    }

    // ============ Brand Brain Components ============
    function EmptyState({ onInputStart, onFileUpload, onLinkPaste }) {
      const [inputValue, setInputValue] = useState("");
      return (
        <div className="flex min-h-[calc(100vh-3.5rem)] flex-col items-center px-6 py-16">

              <div className="flex flex-wrap justify-center gap-2">
                {TAGS.map((tag) => (
                  <button key={tag.label} type="button" onClick={() => setInputValue(p => (p ? p + "\n\n" + tag.template : tag.template))}
                    className="rounded-lg border-2 border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-600 hover:border-black hover:bg-gray-50 hover:text-black">{tag.label}</button>
                ))}
              </div>
            </div>
            <div className="w-full rounded-xl border-2 border-dashed border-gray-200 bg-gray-50/50 px-6 py-8">
              <p className="mb-4 text-center text-sm font-medium text-gray-600">🧩 专属品牌 DNA 档案预览</p>
              <div className="grid grid-cols-2 gap-4 text-sm text-gray-500">
                <div>• 核心定位: ...</div><div>• 核心受众: ...</div><div>• 品牌人设: ...</div><div>• 沟通避坑: ...</div>
              </div>
              <p className="mt-4 text-center text-xs text-gray-400">( 投喂你的碎片信息，我来生成专属结构化档案 )</p>
            </div>
          </div>
          <div className="mt-auto w-full max-w-2xl border-t border-gray-200 pt-6">

        </div>
      );

    function InputtingState({ items, onAddMore, onFileUpload, onStartParse }) {
      return (
        <div className="flex min-h-[calc(100vh-3.5rem)] flex-col items-center px-6 py-16">
          <div className="flex max-w-2xl flex-col items-center gap-12">
            <h1 className="text-3xl font-bold tracking-tight text-black md:text-4xl">✨ 欢迎构建你的专属【品牌知识库】 ✨</h1>
            <div className="w-full space-y-3">
              <p className="text-sm font-medium text-gray-600">已接收的内容：</p>
              {items.map((item) => (
                <div key={item.id} className="flex items-center gap-3 rounded-lg border border-gray-200 bg-gray-50 px-4 py-3">
                  <span className="text-lg">{TYPE_ICONS[item.type]}</span>
                  <span className="flex-1 text-sm text-gray-700">{item.type === "text" ? item.preview : item.name}{item.size && <span className="ml-2 text-gray-400">({item.size})</span>}</span>
                </div>
              ))}

          const t = text.trim().replace(/\s+/g, " ");
          const punctuations = ["。", "！", "？", "."];
          const ends = punctuations.some((p) => t.endsWith(p));
          const polished = ends ? t : t + "。";
          setFields((f) => ({ ...f, [key]: polished }));
          setPolishing(null);
        }, 600);

              type="button"
              onClick={() => lightPolish(fields[keyName], keyName)}
              disabled={polishing === keyName || !fields[keyName]?.trim()}

    function SavedPreviewState({ archive, onArchiveSave }) {
      const [editingSectionId, setEditingSectionId] = useState(null);
      const [agentPanelOpen, setAgentPanelOpen] = useState(false);
      const [editValue, setEditValue] = useState("");
      const [editMatrixData, setEditMatrixData] = useState(null);
      const [sectionMaterials, setSectionMaterials] = useState([]);
      const [addSourceOpen, setAddSourceOpen] = useState(false);
      const [aiRefining, setAiRefining] = useState(false);
      const [popoverSectionId, setPopoverSectionId] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [deleteScope, setDeleteScope] = useState("section");
      const [regeneratingSectionIds, setRegeneratingSectionIds] = useState(new Set());
      const [regeneratedSectionIds, setRegeneratedSectionIds] = useState(new Set());
      const popoverRef = useRef(null);
      const editingSection = archive.sections.find(s => s.id === editingSectionId);
      const isEditingMatrix = editingSection?.matrixData != null;

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (popoverRef.current && !popoverRef.current.contains(e.target)) setPopoverSectionId(null);
        };
        if (popoverSectionId) document.addEventListener("click", handleClickOutside);
        return () => document.removeEventListener("click", handleClickOutside);
      }, [popoverSectionId]);

      const handleEnterEdit = (section) => {
        if (section.matrixData) {
          setEditMatrixData(section.matrixData.map(p => ({ ...p, visualVoice: { ...p.visualVoice } })));
          setEditValue("");
        } else {
          setEditValue(section.content.join("\n"));
          setEditMatrixData(null);
        }
        setEditingSectionId(section.id);
        setSectionMaterials([]);
        setAgentPanelOpen(true);
      };
      const closeAgentPanel = () => {
        setAgentPanelOpen(false);
        setEditingSectionId(null);
        setEditValue("");
        setEditMatrixData(null);
        setSectionMaterials([]);
        setAddSourceOpen(false);
      };
      const handleSave = () => {
        if (!editingSectionId) return;
        const sourcesFromMaterials = sectionMaterials.map(m => ({ type: m.type, name: m.preview || m.name }));
        const newSections = archive.sections.map(s => {
          if (s.id !== editingSectionId) return s;
          if (editMatrixData != null) {
            return { ...s, matrixData: editMatrixData, sources: sourcesFromMaterials.length ? sourcesFromMaterials : (s.sources || []) };
          }
          const newContent = editValue.split(/\n/).map(l => l.trim()).filter(Boolean);
          return { ...s, content: newContent, sources: sourcesFromMaterials.length ? sourcesFromMaterials : (s.sources || []) };
        });
        onArchiveSave?.({ ...archive, sections: newSections, updatedAt: new Date().toISOString().slice(0, 10) });
        setEditingSectionId(null);
        setEditValue("");
        setEditMatrixData(null);
        setSectionMaterials([]);
        setAgentPanelOpen(false);
      };
      const handleCancel = () => {
        setEditingSectionId(null);
        setEditValue("");
        setEditMatrixData(null);
        setSectionMaterials([]);
        setAddSourceOpen(false);
        setAgentPanelOpen(false);
      };
      const updateMatrixItem = (idx, field, value) => {
        setEditMatrixData(prev => {
          if (!prev) return prev;
          const next = [...prev];
          const item = { ...next[idx] };
          if (field === "identity") item.identity = value;
          else if (field === "materialReq") item.materialReq = value;
          else if (field === "visual") item.visualVoice = { ...item.visualVoice, visual: value };
          else if (field === "verbal") item.visualVoice = { ...item.visualVoice, verbal: value };
          next[idx] = item;
          return next;
        });
      };

      const handleAddFile = (file) => {
        setSectionMaterials(p => [...p, {
          id: "f-" + Date.now(),
          type: file.type.startsWith("image/") ? "image" : "file",
          name: file.name,
          size: (file.size / 1024).toFixed(0) + "KB"
        }]);
      };
      const handleAddLink = (url) => {
        setSectionMaterials(p => [...p, { id: "l-" + Date.now(), type: "link", name: url }]);
      };
      const handleAddText = (text) => {
        setSectionMaterials(p => [...p, {
          id: "t-" + Date.now(),
          type: "text",
          name: "粘贴文字",
          preview: text.slice(0, 40) + (text.length > 40 ? "…" : ""),
          content: text
        }]);
      };

      const handleAiRefine = () => {
        if (sectionMaterials.length === 0) {
          setEditValue(editValue ? editValue + "\n\n（请先添加资料再使用 AI 提炼）" : "请先添加资料：上传文件、添加链接或粘贴文字，再点击「基于资料提炼」。");
          return;
        }
        setAiRefining(true);
        setTimeout(() => {
          const textFromMaterials = sectionMaterials
            .filter(m => m.type === "text" && (m.content || m.preview))
            .map(m => m.content || m.preview || "")
            .join("\n\n");
          const refined = textFromMaterials
            ? (editValue ? editValue + "\n\n--- AI 基于资料提炼 ---\n" + textFromMaterials : textFromMaterials)
            : (editValue || "（已解析上传资料，建议结合实际内容进一步润色）");
          setEditValue(refined);
          setAiRefining(false);
        }, 1500);
      };

      const handleDeleteSource = (e, section, src) => {
        e.stopPropagation();
        setDeleteTarget({ sectionId: section.id, sectionTitle: section.title, source: src });
        setDeleteScope("section");
      };

      const handleDeleteConfirm = () => {
        if (!deleteTarget) return;
        const { sectionId, source } = deleteTarget;
        const srcKey = source.name;
        const affectedIds = deleteScope === "global"
          ? archive.sections.filter(s => (s.sources || []).some(r => r.name === srcKey)).map(s => s.id)
          : [sectionId];
        const newSections = archive.sections.map(s => {
          if (!affectedIds.includes(s.id)) return s;
          const newSources = (s.sources || []).filter(r => r.name !== srcKey);
          return { ...s, sources: newSources };
        });
        setDeleteTarget(null);
        setPopoverSectionId(null);
        setRegeneratingSectionIds(new Set(affectedIds));
        onArchiveSave?.({ ...archive, sections: newSections, updatedAt: new Date().toISOString().slice(0, 10) });
        setTimeout(() => {
          setRegeneratingSectionIds(new Set());
          setRegeneratedSectionIds(new Set(affectedIds));
          setTimeout(() => setRegeneratedSectionIds(new Set()), 2500);
        }, 2000);
      };

      return (
        <div className="flex min-h-[calc(100vh-3.5rem)] w-full">
          <div className={`min-h-[calc(100vh-3.5rem)] flex-1 overflow-y-auto px-6 py-12 ${agentPanelOpen ? "min-w-0" : ""}`}>
          <DeleteSourceModal
            isOpen={!!deleteTarget}
            onClose={() => setDeleteTarget(null)}
            sourceName={deleteTarget?.source?.name ?? ""}
            deleteScope={deleteScope}
            onScopeChange={setDeleteScope}
            onConfirm={handleDeleteConfirm}
          />
          <AddSourceModal
            isOpen={addSourceOpen}
            onClose={() => setAddSourceOpen(false)}
            onFileUpload={handleAddFile}
            onLinkAdd={(url) => { handleAddLink(url); setAddSourceOpen(false); }}
            onTextAdd={(text) => { handleAddText(text); setAddSourceOpen(false); }}
            title={editingSection ? `为「${editingSection.title}」补充资料` : "添加资料"}
          />
          <div className={`mx-auto ${agentPanelOpen ? "max-w-4xl" : "max-w-6xl"}`}>
            <div className="space-y-10 border-t border-gray-200 pt-8">
              {archive.sections.filter(s => s.id !== "channel_matrix").map((section) => {
                const isEditing = editingSectionId === section.id;
                return (
                  <section key={section.id} className="relative rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
                    <div className="mb-4 flex items-start justify-between gap-4">
                      <h2 className="text-lg font-semibold text-black">{section.title}</h2>
                      {isEditing ? (

    function AddAccountModal({ isOpen, onClose, platforms, onConfirm }) {
      const [selectedId, setSelectedId] = useState(null);
      const [identity, setIdentity] = useState("");
      const [visualVoiceText, setVisualVoiceText] = useState("");
      const [materialReq, setMaterialReq] = useState("");
      const [identityAltIdx, setIdentityAltIdx] = useState(0);
      const [previewOpen, setPreviewOpen] = useState(false);
      const pickerList = ADD_ACCOUNT_PLATFORM_IDS.map(id => platforms.find(p => p.id === id)).filter(Boolean);

      useEffect(() => {
        if (!isOpen) return;
        setSelectedId(null);
        setIdentity("");
        setVisualVoiceText("");
        setMaterialReq("");
        setIdentityAltIdx(0);
        setPreviewOpen(false);
      }, [isOpen]);

      useEffect(() => {
        if (!isOpen || !selectedId) return;
        const matrix = CHANNELS_MATRIX_PROPOSAL_BY_ID[selectedId];
        const fb = ADD_ACCOUNT_FALLBACK_DRAFT;
        if (matrix) {
          setIdentity(matrix.identity);
          setVisualVoiceText(`画面要[${matrix.visualVoice?.visual ?? ""}]；口吻要[${matrix.visualVoice?.verbal ?? ""}]`);
          setMaterialReq(matrix.materialReq);
        } else {
          setIdentity(fb.identity);
          setVisualVoiceText(`画面要[${fb.visualVoice.visual}]；口吻要[${fb.visualVoice.verbal}]`);
          setMaterialReq(fb.materialReq);
        }
      }, [isOpen, selectedId]);

      const shuffleIdentity = () => {
        const i = (identityAltIdx + 1) % IDENTITY_ALTERNATES.length;
        setIdentityAltIdx(i);
        setIdentity(IDENTITY_ALTERNATES[i]);
      };
      const shuffleVisual = () => {
        setVisualVoiceText(p => p + (p.match(/✨/) ? "" : " ✨ 已微调语气"));
      };

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onClick={onClose}>
          <div className="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-xl border border-gray-200 bg-white shadow-xl" onClick={e => e.stopPropagation()}>
            <div className="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 bg-white px-5 py-4">
              <h2 className="text-lg font-semibold text-black">✨ 新增发声账号</h2>
              <button type="button" onClick={onClose} className="rounded p-2 text-gray-400 hover:bg-gray-100 hover:text-black">✕</button>
            </div>
            <div className="space-y-6 px-5 py-5">
              <div>
                <p className="text-sm font-medium text-gray-500">第一步：选择平台</p>
                <div className="mt-3 flex flex-wrap gap-2">
                  {pickerList.map((p) => (
                    <button
                      key={p.id}
                      type="button"
                      onClick={() => setSelectedId(p.id)}
                      className={`rounded-lg border px-3 py-2 text-sm font-medium transition-colors ${selectedId === p.id ? "border-black bg-gray-100 text-black" : "border-gray-200 bg-white text-gray-700 hover:border-gray-300"}`}
                    >
                      <span className="mr-1">{p.icon}</span>
                      {p.name}
                    </button>
                  ))}
                </div>
              </div>
              <hr className="border-gray-200" />
              <div className={!selectedId ? "pointer-events-none opacity-50" : ""}>
                <p className="text-sm font-medium text-gray-500">第二步：确认账号性格 <span className="font-normal text-gray-400">(已基于 <strong className="text-gray-600">品牌基因</strong> 自动生成建议)</span></p>
                {!selectedId && <p className="mt-2 text-xs text-amber-600">请先选择平台</p>}
                <div className="mt-4 space-y-4">
                  <div>
                    <div className="mb-2 flex items-center gap-2">
                      <span className="text-sm font-semibold text-black">● 账号身份</span>
                      <button type="button" onClick={shuffleIdentity} className="rounded border border-gray-200 px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-50">✨ 换个说法</button>
                    </div>
                    <textarea value={identity} onChange={e => setIdentity(e.target.value)} rows={3} className="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-600 outline-none focus:border-black" />
                  </div>
                  <div>
                    <div className="mb-2 flex items-center gap-2">
                      <span className="text-sm font-semibold text-black">● 画风口吻</span>
                      <button type="button" onClick={shuffleVisual} className="rounded border border-gray-200 px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-50">✨</button>
                    </div>
                    <textarea value={visualVoiceText} onChange={e => setVisualVoiceText(e.target.value)} rows={3} className="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-600 outline-none focus:border-black" />
                  </div>
                  <div>
                    <div className="mb-2 flex items-center gap-2">
                      <span className="text-sm font-semibold text-black">● 物料要求</span>
                    </div>
                    <textarea value={materialReq} onChange={e => setMaterialReq(e.target.value)} rows={3} className="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-600 outline-none focus:border-black" />
                  </div>
                </div>
              </div>
              {previewOpen && (
                <div className="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-4 text-sm text-gray-600">
                  <p className="text-xs font-medium text-gray-500">风格样本预览</p>
                  <p className="mt-2 line-clamp-3">基于当前设定，生成的一条示例文案将在此展示（演示）。</p>
                </div>
              )}
            </div>
            <div className="sticky bottom-0 flex flex-wrap items-center justify-between gap-2 border-t border-gray-200 bg-white px-5 py-4">
              <button type="button" onClick={() => setPreviewOpen(true)} className="rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-600 hover:bg-gray-50">预览风格样本</button>
              <div className="flex gap-2">
                <Button variant="secondary" size="sm" onClick={onClose}>取消</Button>
                <Button size="sm" onClick={() => selectedId && onConfirm({ platformId: selectedId, identity, visualVoiceText, materialReq })} disabled={!selectedId}>确认添加</Button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ChannelsPage({ syncedChannelMatrix, onSyncConsumed }) {
      const [platforms, setPlatforms] = useState(CHANNELS_DATA);
      const [addAccountOpen, setAddAccountOpen] = useState(false);
      const [collapsed, setCollapsed] = useState({});
      const [bindFlowState, setBindFlowState] = useState("idle"); // idle | choice | picker | pipedream
      const [bindTarget, setBindTarget] = useState(null); // { platform, account }
      const [expandedSampleId, setExpandedSampleId] = useState(null); // acc.id
      const [editingAccountId, setEditingAccountId] = useState(null); // acc.id
      const [editDraft, setEditDraft] = useState(null); // { handle, identity, visualVoice: { visual, verbal }, materialReq }

      useEffect(() => {
        if (syncedChannelMatrix && syncedChannelMatrix.length > 0 && onSyncConsumed) {
          const byId = Object.fromEntries(syncedChannelMatrix.map(p => [p.id, p]));
          setPlatforms(prev => prev.map(pl => {
            const m = byId[pl.id];
            if (!m) return pl;
            return { ...pl, accounts: pl.accounts.map(a => ({ ...a, identity: m.identity, visualVoice: m.visualVoice, materialReq: m.materialReq, positioning: m.role })) };
          }));
          onSyncConsumed();
        }
      }, [syncedChannelMatrix, onSyncConsumed]);

      const startEdit = (platform, acc) => {
        const matrix = CHANNELS_MATRIX_PROPOSAL_BY_ID[platform.id] || {};
        setEditingAccountId(acc.id);
        setEditDraft({
          handle: acc.handle,
          identity: acc.identity ?? matrix.identity ?? "",
          visualVoice: acc.visualVoice ?? matrix.visualVoice ?? { visual: "", verbal: "" },
          materialReq: acc.materialReq ?? matrix.materialReq ?? ""
        });
      };
      const cancelEdit = () => {
        setEditingAccountId(null);
        setEditDraft(null);
      };
      const [saveVerifyOpen, setSaveVerifyOpen] = useState(false);
      const openSaveVerify = () => setSaveVerifyOpen(true);
      const closeSaveVerify = () => setSaveVerifyOpen(false);
      const saveEdit = () => {
        if (!editingAccountId || !editDraft) return;
        setPlatforms(p => p.map(pl => ({
          ...pl,
          accounts: pl.accounts.map(a => a.id !== editingAccountId ? a : {
            ...a,
            handle: editDraft.handle,
            identity: editDraft.identity,
            visualVoice: editDraft.visualVoice,
            materialReq: editDraft.materialReq
          })
        })));
        cancelEdit();
      };
      const confirmSaveAndExit = () => {
        saveEdit();
        closeSaveVerify();
      };
      const platformCount = platforms.length;
      const accountCount = platforms.reduce((sum, p) => sum + p.accounts.length, 0);

      const togglePlatform = (id) => setCollapsed(p => ({ ...p, [id]: !p[id] }));

      const handleBindClick = (platform, account) => {
        const linkedList = LINKED_ACCOUNTS_BY_PLATFORM[platform.id] ?? [];
        setBindTarget({ platform, account });
        if (linkedList.length > 0) {
          setBindFlowState("choice");
        } else {
          setBindFlowState("pipedream");
        }
      };

      const closeBindChoice = () => {
        setBindFlowState("idle");
        setBindTarget(null);
      };

      const closePipedreamModal = () => {
        setBindFlowState("idle");
        setBindTarget(null);
      };

      const handleShowPicker = () => setBindFlowState("picker");
      const handleBackFromPicker = () => setBindFlowState("choice");
      const handleSelectNew = () => {
        setBindFlowState("pipedream");
      };
      const handleBindToAccount = (linkedAcc) => {
        if (!bindTarget) return;
        const { platform, account } = bindTarget;
        setPlatforms(p => p.map(pl => pl.id !== platform.id ? pl : {
          ...pl,
          accounts: pl.accounts.map(a => a.id !== account.id ? a : { ...a, status: "bound", handle: linkedAcc.handle, needBind: false })
        }));
        closeBindChoice();
      };

      const [unbindTarget, setUnbindTarget] = useState(null);
      const openUnbindConfirm = (platform, account) => setUnbindTarget({ platform, account });
      const closeUnbindConfirm = () => setUnbindTarget(null);
      const handleUnbindConfirm = () => {
        if (!unbindTarget) return;
        const { platform, account } = unbindTarget;
        setPlatforms(p => p.map(pl => pl.id !== platform.id ? pl : {
          ...pl,
          accounts: pl.accounts.map(a => a.id !== account.id ? a : { ...a, status: "style_only", handle: "@未配置", needBind: true })
        }));
        closeUnbindConfirm();
      };

      const [deleteTarget, setDeleteTarget] = useState(null); // { type: 'account', platform, account } | { type: 'platform', platform }
      const closeDeleteConfirm = () => setDeleteTarget(null);
      const openDeleteAccount = (platform, account) => {
        setDeleteTarget({ type: "account", platform, account });
      };
      const openDeletePlatform = (platform) => {
        setDeleteTarget({ type: "platform", platform });
      };
      const handleDeleteConfirm = () => {
        if (!deleteTarget) return;
        if (deleteTarget.type === "account") {
          const { platform, account } = deleteTarget;
          if (editingAccountId === account.id) {
            setEditingAccountId(null);
            setEditDraft(null);
          }
          if (expandedSampleId === account.id) setExpandedSampleId(null);
          if (bindTarget?.account?.id === account.id) {
            setBindFlowState("idle");
            setBindTarget(null);
          }
          setPlatforms(prev => prev
            .map(pl => {
              if (pl.id !== platform.id) return pl;
              return { ...pl, accounts: pl.accounts.filter(a => a.id !== account.id) };
            })
            .filter(pl => pl.accounts.length > 0));
        } else {
          const { platform } = deleteTarget;
          if (bindTarget?.platform?.id === platform.id) {
            setBindFlowState("idle");
            setBindTarget(null);
          }
          if (platform.accounts.some(a => a.id === editingAccountId)) {
            setEditingAccountId(null);
            setEditDraft(null);
          }
          if (platform.accounts.some(a => a.id === expandedSampleId)) setExpandedSampleId(null);
          setPlatforms(prev => prev.filter(pl => pl.id !== platform.id));
        }
        setDeleteTarget(null);
      };

      const PLATFORMS_WITH_BIND = ["linkedin", "shopify", "wordpress"];
      const linkedAccounts = bindTarget ? (LINKED_ACCOUNTS_BY_PLATFORM[bindTarget.platform?.id] ?? []) : [];
      const showChoicePopover = (bindFlowState === "choice" || bindFlowState === "picker") && bindTarget;

      const parseVisualVoiceFromText = (text) => {
        const v = text.match(/画面要\[([^\]]*)\]/);
        const verbal = text.match(/口吻要\[([^\]]*)\]/);
        return { visual: (v && v[1]) ? v[1].trim() : "", verbal: (verbal && verbal[1]) ? verbal[1].trim() : "" };
      };

      const handleAddAccountConfirm = ({ platformId, identity, visualVoiceText, materialReq }) => {
        const matrix = CHANNELS_MATRIX_PROPOSAL_BY_ID[platformId];
        const vv = parseVisualVoiceFromText(visualVoiceText);
        const visualVoice = (vv.visual || vv.verbal) ? vv : (matrix?.visualVoice ?? { visual: "", verbal: "" });
        const newAcc = {
          id: "acc-" + Date.now(),
          handle: "@未配置",
          status: "style_only",
          positioning: matrix?.role ?? "新账号",
          identity,
          visualVoice,
          materialReq,
          needBind: true
        };
        setPlatforms(prev => prev.map(pl => pl.id !== platformId ? pl : { ...pl, accounts: [...pl.accounts, newAcc] }));
        setAddAccountOpen(false);
      };

      return (
        <div className="min-h-screen px-6 py-8">
          <AddAccountModal isOpen={addAccountOpen} onClose={() => setAddAccountOpen(false)} platforms={platforms} onConfirm={handleAddAccountConfirm} />
          {showChoicePopover && <div className="fixed inset-0 z-40" onClick={closeBindChoice} aria-hidden="true" />}
          <SaveVerifyModal isOpen={saveVerifyOpen} onClose={closeSaveVerify} onBackToEdit={closeSaveVerify} onConfirm={confirmSaveAndExit} draft={editDraft} />
          <UnbindConfirmModal isOpen={!!unbindTarget} onClose={closeUnbindConfirm} onConfirm={handleUnbindConfirm} accountHandle={unbindTarget?.account?.handle} />
          <DeleteConfirmModal
            isOpen={!!deleteTarget}
            onClose={closeDeleteConfirm}
            onConfirm={handleDeleteConfirm}
            title={deleteTarget?.type === "platform" ? "删除整个渠道？" : "删除该账号？"}
            description={
              deleteTarget?.type === "platform"
                ? `将移除「${deleteTarget.platform.icon} ${deleteTarget.platform.name}」及其下全部账号，此操作不可撤销。`
                : `将永久移除账号「${deleteTarget?.account?.handle ?? ""}」，此操作不可撤销。`
            }
            confirmLabel="删除"
          />
          <BindModal isOpen={bindFlowState === "pipedream"} onClose={closePipedreamModal} platformName={bindTarget?.platform?.name} platformIcon={bindTarget?.platform?.icon} />
          <div className="mx-auto max-w-4xl">
            <div className="mb-8 flex items-center justify-between">
              <h1 className="text-xl font-bold text-black">您的营销矩阵 <span className="font-normal text-gray-500">(共 {platformCount} 个平台, {accountCount} 个账号)</span></h1>
              <Button size="sm" onClick={() => setAddAccountOpen(true)}>+ 新增营销渠道</Button>
            </div>
            <div className="space-y-4">
              {platforms.map((platform) => (
                <div key={platform.id} className="rounded-xl border border-gray-200 bg-white">
                  <div className="flex w-full items-center gap-2 px-5 py-4">
                    <button
                      type="button"
                      onClick={() => togglePlatform(platform.id)}
                      className="flex min-w-0 flex-1 items-center gap-3 text-left"
                    >
                      <span className={`shrink-0 text-gray-500 transition-transform ${collapsed[platform.id] ? "rotate-90" : ""}`}>▾</span>
                      <span className="text-2xl">{platform.icon}</span>
                      <span className="text-base font-semibold text-black">{platform.name}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => openDeletePlatform(platform)}
                      className="shrink-0 rounded border border-gray-200 px-2 py-1 text-xs text-gray-600 hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                    >
                      🗑️ 删除渠道
                    </button>
                  </div>
                  {!collapsed[platform.id] && (
                    <div className="space-y-4 p-5 pt-0">
                      {platform.accounts.map((acc, accIdx) => {
                        const matrix = CHANNELS_MATRIX_PROPOSAL_BY_ID[platform.id] || {};
                        const identity = acc.identity ?? matrix.identity;
                        const visualVoice = acc.visualVoice ?? matrix.visualVoice;
                        const materialReq = acc.materialReq ?? matrix.materialReq;
                        const isEditing = editingAccountId === acc.id;
                        const draft = isEditing ? editDraft : null;
                        const isBound = acc.status === "bound" && acc.handle && acc.handle !== "@未配置";
                        const accountTitle = isBound ? acc.handle : `账号 ${accIdx + 1}`;
                        return (
                          <div key={acc.id} className="w-full rounded-lg border border-gray-200 bg-white">
                            <div className="flex flex-wrap items-center justify-between gap-2 px-5 py-4">
                              <div className="flex min-w-0 items-center gap-2">
                                {isEditing ? (
                                  <input type="text" value={draft?.handle ?? ""} onChange={e => setEditDraft(d => d ? { ...d, handle: e.target.value } : null)}
                                    placeholder="编辑名字" className="min-w-0 max-w-md flex-1 rounded border border-gray-200 px-2 py-1 text-sm outline-none focus:border-black" />
                                ) : (
                                  <span className="truncate text-base font-semibold text-black" title={accountTitle}>{accountTitle}</span>
                                )}
                              </div>
                              <div className="flex flex-wrap gap-1">
                                {isEditing ? (
                                  <>
                                    <button type="button" onClick={cancelEdit} className="rounded border border-gray-200 px-2 py-1 text-xs text-gray-600 hover:bg-gray-50">取消</button>
                                    <button type="button" onClick={openSaveVerify} className="rounded bg-black px-2 py-1 text-xs text-white hover:bg-gray-800">✨ 保存并验证</button>
                                  </>
                                ) : (
                                  <>
                                    <button type="button" onClick={() => startEdit(platform, acc)} className="flex items-center gap-1 rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 hover:text-black">⚙️ 编辑</button>
                                    {acc.needBind && (
                                  <div className={`relative ${showChoicePopover && bindTarget?.account?.id === acc.id ? "z-50" : ""}`}>
                                    <button type="button" onClick={() => handleBindClick(platform, acc)} className="flex items-center gap-1 rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 hover:text-black">🔗 绑定</button>
                                    {showChoicePopover && bindTarget?.account?.id === acc.id && (
                                      <BindChoicePopover
                                        isOpen
                                        mode={bindFlowState}
                                        platform={bindTarget.platform}
                                        linkedAccounts={linkedAccounts}
                                        onShowPicker={handleShowPicker}
                                        onBindToAccount={handleBindToAccount}
                                        onSelectNew={handleSelectNew}
                                        onBack={handleBackFromPicker}
                                        onClose={closeBindChoice}
                                      />
                                    )}
                                  </div>
                                )}
                                    {acc.status === "bound" && PLATFORMS_WITH_BIND.includes(platform.id) && (
                                      <>
                                        <button type="button" onClick={() => handleBindClick(platform, acc)} className="flex items-center gap-1 rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 hover:text-black">🔄 更换</button>
                                        <button type="button" onClick={() => openUnbindConfirm(platform, acc)} className="flex items-center gap-1 rounded px-2 py-1 text-xs text-gray-500 hover:bg-red-50 hover:text-red-600">🔓 解绑</button>
                                      </>
                                    )}
                                    <button type="button" onClick={() => openDeleteAccount(platform, acc)} className="flex items-center gap-1 rounded px-2 py-1 text-xs text-gray-500 hover:bg-red-50 hover:text-red-700">🗑️ 删除</button>
                                  </>
                                )}
                              </div>
                            </div>
                            <hr className="border-gray-200" />
                            <div className="grid grid-cols-1 gap-4 px-5 py-4 md:grid-cols-3">
                              {isEditing ? (
                                <>
                                  <div>
                                    <div className="mb-1 flex items-center gap-2">
                                      <p className="text-xs font-semibold text-gray-500">账号身份</p>
                                      <button type="button" className="rounded px-1.5 py-0.5 text-xs text-gray-400 hover:bg-gray-100 hover:text-black">✨ 润色</button>
                                    </div>
                                    <textarea value={draft?.identity ?? ""} onChange={e => setEditDraft(d => d ? { ...d, identity: e.target.value } : null)}
                                      rows={3} className="w-full rounded border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black" placeholder="扮演一位..." />
                                  </div>
                                  <div>
                                    <div className="mb-1 flex items-center gap-2">
                                      <p className="text-xs font-semibold text-gray-500">画风口吻</p>
                                      <button type="button" className="rounded px-1.5 py-0.5 text-xs text-gray-400 hover:bg-gray-100 hover:text-black">✨ 润色</button>
                                    </div>
                                    <textarea value={draft?.visualVoice ? `画面要[${draft.visualVoice.visual ?? ""}]，说话要[${draft.visualVoice.verbal ?? ""}]` : ""} onChange={e => {
                                      const v = e.target.value;
                                      const visualM = v.match(/画面要\[([^\]]*)\]/);
                                      const verbalM = v.match(/说话要\[([^\]]*)\]/);
                                      setEditDraft(d => d ? { ...d, visualVoice: { visual: visualM?.[1] ?? "", verbal: verbalM?.[1] ?? "" } } : null);
                                    }}
                                      rows={3} placeholder="画面要[...]，说话要[...]" className="w-full rounded border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black" />
                                  </div>
                                  <div>
                                    <div className="mb-1 flex items-center gap-2">
                                      <p className="text-xs font-semibold text-gray-500">物料要求</p>
                                      <button type="button" className="rounded px-1.5 py-0.5 text-xs text-gray-400 hover:bg-gray-100 hover:text-black">✨ 润色</button>
                                    </div>
                                    <textarea value={draft?.materialReq ?? ""} onChange={e => setEditDraft(d => d ? { ...d, materialReq: e.target.value } : null)}
                                      rows={3} className="w-full rounded border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black" placeholder="主打..." />
                                  </div>
                                </>
                              ) : (
                                <>
                              {identity && (
                                <div>
                                  <p className="mb-1 text-xs font-semibold text-gray-500">账号身份</p>
                                  <p className="text-sm text-gray-700">{identity}</p>
                                </div>
                              )}
                              {visualVoice && (
                                <div>
                                  <p className="mb-1 text-xs font-semibold text-gray-500">画风口吻</p>
                                  <p className="text-sm text-gray-700">画面要[{visualVoice.visual}]，说话要[{visualVoice.verbal}]</p>
                                </div>
                              )}
                              {materialReq && (
                                <div>
                                  <p className="mb-1 text-xs font-semibold text-gray-500">物料要求</p>
                                  <p className="text-sm text-gray-700">{materialReq}</p>
                                </div>
                              )}
                                </>
                              )}
                            </div>
                            {!isEditing && (
                            <div className="border-t border-gray-100 px-5 py-3">
                              {expandedSampleId === acc.id ? (
                                <>
                                  <button type="button" onClick={() => setExpandedSampleId(null)} className="mb-4 text-xs text-gray-500 hover:text-black">🔼 收起风格样本</button>
                                  <div className="rounded-lg border border-gray-200 bg-gray-50 p-4">
                                    <div className="flex gap-4">
                                      <div className="flex h-24 w-24 shrink-0 items-center justify-center rounded-lg border-2 border-dashed border-gray-300 bg-white text-2xl text-gray-400">🖼️</div>
                                      <div className="min-w-0 flex-1">
                                        <p className="text-xs font-semibold text-gray-500">样板标题：为什么我们坚持使用 100% 可回收包装？</p>
                                        <p className="text-xs text-gray-400">(基于 1:1 图文)</p>
                                        <p className="mt-2 line-clamp-2 text-sm text-gray-600">在 Workflex 的逻辑里，环保从来不是营销的口号。我们认为，真正的长期主义应该体现在每一个看不见的细节里。哪怕这会增加生产成本，但...</p>
                                      </div>
                                    </div>
                                  </div>
                                </>
                              ) : (
                                <button type="button" onClick={() => setExpandedSampleId(acc.id)} className="text-xs text-gray-500 hover:text-black">✨ 查看该账号的风格样本 (Sample)</button>
                              )}
                            </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ============ App ============
    function BrandBrainPage({ archive, onArchiveSave }) {
      const [state, setState] = useState("saved_preview");
      const [uploadedItems, setUploadedItems] = useState([]);

      const handleInputStart = useCallback((text) => {
        setUploadedItems(p => [...p, { id: "text-" + Date.now(), type: "text", name: "用户输入", preview: text.slice(0, 50) + (text.length > 50 ? "…" : "") }]);
        setState("inputting");
      }, []);

      const handleFileUpload = useCallback((file) => {
        setUploadedItems(p => [...p, { id: "file-" + Date.now(), type: file.type.startsWith("image/") ? "image" : "file", name: file.name, size: (file.size / 1024 / 1024).toFixed(1) + "MB" }]);
        setState("inputting");
      }, []);

      const handleAddMore = useCallback((text) => {
        setUploadedItems(p => [...p, { id: "text-" + Date.now(), type: "text", name: "用户输入", preview: text.slice(0, 50) + (text.length > 50 ? "…" : "") }]);
      }, []);

      const handleStartParse = useCallback(() => { setState("processing"); setTimeout(() => setState("chat_canvas"), 5000); }, []);
      const handleConfirm = useCallback(() => setState("saved_preview"), []);
      const handleEdit = useCallback(() => setState("archive_edit"), []);

      const getEditFieldsFromArchive = useCallback((arch) => {
        const byId = (id) => arch.sections.find(s => s.id === id);
        return {
          core: (byId("identity")?.content?.[0] || "").replace(/^品牌定位[：:]?\s*/, "") || "中小企业的 AI 分发操作系统，解决流量焦虑。",
          audience: (byId("audience")?.content?.join("；") || "").replace(/^核心人群[：:]?\s*/, "") || "希望通过 AI 实现降本增效的个体主理人。",
          persona: (byId("tone")?.content?.[0] || "").replace(/^沟通语气[：:]?\s*/, "") || "一位专业、有温度的职场前辈，金句频出。",
          guardrails: (byId("guardrails")?.content?.join("；") || "") || "避免使用高深的技术术语，多用直白的类比。"
        };
      }, []);

      const handleSaveEdit = useCallback((fields) => {
        const updater = { identity: `品牌定位：${fields.core}`, audience: fields.audience, tone: fields.persona, guardrails: fields.guardrails };
        onArchiveSave({
          ...archive,
          sections: archive.sections.map(s => {
            if (s.id === "identity") return { ...s, content: [updater.identity] };
            if (s.id === "audience") return { ...s, content: [updater.audience] };
            if (s.id === "tone") return { ...s, content: [updater.tone] };
            if (s.id === "guardrails") return { ...s, content: [updater.guardrails] };
            return s;
          })
        });
        setState("saved_preview");
      }, [archive, onArchiveSave]);

      const handleCancelEdit = useCallback(() => setState("saved_preview"), []);

      return (
        <div className="flex min-h-screen flex-col bg-white">
          <main className="flex-1">
            {state === "empty" && <EmptyState onInputStart={handleInputStart} onFileUpload={handleFileUpload} />}
            {state === "inputting" && <InputtingState items={uploadedItems} onAddMore={handleAddMore} onFileUpload={handleFileUpload} onStartParse={handleStartParse} />}
            {state === "processing" && <ProcessingState />}
            {state === "chat_canvas" && <ChatCanvasState archive={archive} onConfirm={handleConfirm} />}
            {["chat_canvas_4_1", "chat_canvas_4_3", "chat_canvas_4_5"].includes(state) && (
              <ChatCanvasState archive={archive} onConfirm={handleConfirm} variant={state.replace("chat_canvas_", "").replace("_", ".")} />
            )}
            {state === "saved_preview" && <SavedPreviewState archive={archive} onArchiveSave={onArchiveSave} />}
            {state === "archive_edit" && (
              <BrandArchiveEditState
                initialFields={getEditFieldsFromArchive(archive)}
                onSave={handleSaveEdit}
                onCancel={handleCancelEdit}
              />
            )}
          </main>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("knowledge");
      const [saveFlyTrigger, setSaveFlyTrigger] = useState(0);
      const [archive, setArchive] = useState(SAMPLE_ARCHIVE);
      const [syncedChannelMatrix, setSyncedChannelMatrix] = useState(null);
      const mergeMatrixIntoArchive = useCallback(() => {
        const matrixSection = { id: "channel_matrix", title: "营销账号矩阵", content: [], matrixData: CHANNELS_MATRIX_PROPOSAL.map(p => ({ ...p, visualVoice: { ...p.visualVoice } })), sources: [] };
        setArchive(prev => {
          const hasMatrix = prev.sections.some(s => s.id === "channel_matrix");
          const newSections = hasMatrix
            ? prev.sections.map(s => s.id === "channel_matrix" ? { ...s, matrixData: CHANNELS_MATRIX_PROPOSAL.map(p => ({ ...p, visualVoice: { ...p.visualVoice } })) } : s)
            : [...prev.sections, matrixSection];
          return { ...prev, sections: newSections, updatedAt: new Date().toISOString().slice(0, 10) };
        });
      }, []);
      const handleSaveToBrand = useCallback(() => {
        mergeMatrixIntoArchive();
        setSaveFlyTrigger(t => t + 1);
      }, [mergeMatrixIntoArchive]);
      const handleSaveToChannels = useCallback(() => {
        const matrix = CHANNELS_MATRIX_PROPOSAL.map(p => ({ ...p, visualVoice: { ...p.visualVoice } }));
        mergeMatrixIntoArchive();
        setSyncedChannelMatrix(matrix);
        setActiveTab("channels");
      }, [mergeMatrixIntoArchive]);
      return (
        <div className="flex min-h-screen w-full flex-row">
          <StarFlyEffect trigger={saveFlyTrigger} />
          <LeftSidebar activeTab={activeTab} onTabChange={setActiveTab} saveFlyTrigger={saveFlyTrigger} />
          <div className="flex min-h-screen min-w-0 flex-1 flex-col overflow-auto">
            <main className="flex min-h-screen flex-1 flex-col overflow-auto bg-white">
              {activeTab === "knowledge" && <KnowledgePage onSaveToBrand={handleSaveToBrand} onSaveToChannels={handleSaveToChannels} />}
              {activeTab === "brand" && <BrandBrainPage archive={archive} onArchiveSave={setArchive} />}
              {activeTab === "channels" && <ChannelsPage syncedChannelMatrix={syncedChannelMatrix} onSyncConsumed={() => setSyncedChannelMatrix(null)} />}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
